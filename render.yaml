services:
  - type: web
    name: fixlab-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUSTED_PROXY
        value: "private-hops"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fixlab-redis
          property: connectionString
      - key: COOKIE_SAME_SITE
        value: none
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
  - type: keyvalue
    name: fixlab-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
